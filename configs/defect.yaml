# Devign defect detection (C).
#
# Scale is set by measurement, not by preference. A timing probe on the
# development GPU (GTX 1660 Ti, 6 GB) came out at 0.25 s per training example:
# Turing GTX cards have no tensor cores, so fp16 buys almost nothing. The grid
# below is sized to finish in a few hours on that card.
#
# Train is subsampled to 2,500 of 21,854 examples, deterministic and stratified
# per seed; the test split is used whole. Both sizes land in every result JSON,
# so a reduced-scale run can never be read as a full one. On a free Colab or
# Kaggle T4 the full split is affordable - see notebooks/run_on_free_gpu.ipynb.
task: defect
epochs: 2
lr: 5.0e-5        # full fine-tuning
peft_lr: 1.0e-4   # PEFT methods, as in the original study
batch_size: 16
grad_accum: 2
max_length: 128
weight_decay: 0.01
warmup_ratio: 0.06
fp16: true
limit_train: 2500
output_dir: results
