# BigCloneBench clone detection (Java).
# Subsampled to 20k train / 4k test to fit the $0 compute budget. The subset is
# deterministic given the seed and its size is recorded in every result file.
task: clone
epochs: 3
lr: 5.0e-5
peft_lr: 1.0e-4
batch_size: 8
grad_accum: 4
max_length: 400
weight_decay: 0.01
warmup_ratio: 0.06
fp16: true
limit_train: 20000
limit_eval: 4000
output_dir: results
