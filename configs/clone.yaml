# BigCloneBench clone detection (Java).
#
# Pair-shaped: two functions share one sequence, so the truncation is harsher
# here than for defect detection at the same length. Subsampled to 2,500 train /
# 2,000 test to fit the same $0 budget; subsets are deterministic and
# label-stratified per seed and their sizes are recorded in every result JSON.
task: clone
epochs: 3
lr: 5.0e-5
peft_lr: 1.0e-4
batch_size: 16
grad_accum: 2
max_length: 128
weight_decay: 0.01
warmup_ratio: 0.06
fp16: true
limit_train: 2500
limit_eval: 2000
output_dir: results
